<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="100%" height="100%" fill="#fff"/><style>text{font:16px sans-serif;fill:#172a43}.title{font-size:22px;font-weight:bold}.small{font-size:14px}line,path{stroke:#334f70;stroke-width:2;fill:none}rect.box{fill:#eaf1fa;stroke:#456b9a;stroke-width:1.5}</style><text x="24" y="32" class="title">Carry cleanup with an inclusive truncated comparison</text><text x="24" y="95" class="">u</text><line x1="95" y1="90" x2="955" y2="90"/><text x="24" y="165" class="">v</text><line x1="95" y1="160" x2="955" y2="160"/><text x="24" y="235" class="">h = 0</text><line x1="95" y1="230" x2="470" y2="230"/><rect class="box" x="125" y="65" width="130" height="190" rx="5"/><text x="133" y="166.0" class="">Add u into v,h</text><rect class="box" x="300" y="137" width="130" height="46" rx="5"/><text x="308" y="166.0" class="">If h: add c</text><line x1="365" y1="185" x2="365" y2="230"/><rect class="box" x="460" y="208" width="94" height="44" rx="5"/><text x="468" y="236.0" class="">X measure</text><line x1="554" y1="230" x2="655" y2="230" stroke-dasharray="5 4"/><line x1="655" y1="230" x2="655" y2="193" stroke-dasharray="5 4"/><rect class="box" x="605" y="62" width="310" height="130" rx="5"/><text x="613" y="133.0" class="">Phase: −(−1)^[u_hi &lt; v_hi]</text><text x="568" y="252" class="small">classical outcome m</text><text x="615" y="84" class="small">Execute only when m = 1</text><text x="26" y="292" class="">Measurement gives (−1)^(m h). Correction uses ĥ = [v_hi ≤ u_hi].</text><text x="26" y="321" class="small">Their product is +1 when ĥ = h; tied high windows choose carry = 1.</text></svg>