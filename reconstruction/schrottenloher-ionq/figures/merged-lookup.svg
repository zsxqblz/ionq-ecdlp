(x₂, y₂)</text><line x1="828" y1="285" x2="888" y2="285" stroke-dasharray="5 4"/><rect class="box" x="830" y="51" width="135" height="50" rx="5"/><text x="838" y="82.0" class="">Phase (−1)^f(j)</text><line x1="888" y1="101" x2="888" y2="285" stroke-dasharray="5 4"/><text x="25" y="353" class="small">f(j) = (m₁ ⊕ m₃) · (x₂(j), y₂(j)) ⊕ m₂ · (3x₂(j) + R)</text><text x="25" y="385" class="small">Rows show successive workspace lifetimes. Dashed lines carry classical measurement masks.</text></svg>